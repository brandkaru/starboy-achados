<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Top Orbit Ring Swoop -->
    <path d="M 140 130 C 130 50, 320 20, 390 45 C 410 52, 360 30, 260 40 C 170 50, 110 90, 140 130 Z" fill="url(#chromeGrad)" filter="url(#glow)"/>
    <path d="M 120 145 C 90 180, 130 210, 240 205 C 370 200, 430 140, 380 90 C 370 75, 385 110, 340 155 C 270 220, 140 210, 120 145 Z" fill="url(#chromeGrad)" filter="url(#glow)"/>

    <!-- Top Spark Star 4-Point -->
    <g transform="translate(255, 35) scale(0.9)">
      <path d="M 0 -22 Q 0 0 -22 0 Q 0 0 0 22 Q 0 0 22 0 Q 0 0 0 -22 Z" fill="#ffffff" />
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#ffffff" stroke-width="1.5" />
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Bottom Spark Star 4-Point -->
    <g transform="translate(245, 195) scale(0.9)">
      <path d="M 0 -22 Q 0 0 -22 0 Q 0 0 0 22 Q 0 0 22 0 Q 0 0 0 -22 Z" fill="#ffffff" />
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#ffffff" stroke-width="1.5" />
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Main Title: ST★RBOY -->
    <text x="250" y="125" text-anchor="middle" font-family="'Syne', 'Orbitron', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="3" filter="url(#glow)">
      ST<tspan fill="#ffffff" font-size="44" dy="-4">★</tspan><tspan dy="4">RBOY</tspan>
    </text>

    <!-- Subtitle: STREETWEAR -->
    <text x="250" y="152" text-anchor="middle" font-family="'Space Grotesk', 'Orbitron', sans-serif" font-weight="800" font-size="16" fill="#e2e8f0" letter-spacing="12">
      STREETWEAR
    </text>
  </g>
</svg>
